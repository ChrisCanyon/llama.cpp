name: Personal fork boundaries
on:
  pull_request:
    branches: [master]
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed files
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: python3 scripts/check_fork_boundaries.py --base "origin/$BASE_BRANCH"
